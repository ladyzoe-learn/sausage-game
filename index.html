<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>烤香腸大師</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：夜市攤位。上面是霓虹招牌＋計分板，中間是炭火烤架，下面是一行操作提示。刻意只做一種「夜晚」配色。 */
:root {
  /* ===== 想改攤位名稱、遊戲時間，改最下面 <script> 裡的 CFG 就好 ===== */
  --night: #1a110d;        /* 夜色背景 */
  --coal: #2a1a13;         /* 烤架底色 */
  --ember: #ff7a2e;        /* 炭火橘 */
  --neon: #ff4438;         /* 招牌霓虹紅 */
  --lantern: #ffc54d;      /* 燈籠黃 */
  --paper: #fbeedd;        /* 文字米白 */
  --muted: #b89b86;        /* 次要文字 */
  --ok: #8fd16a;           /* 剛好的區間 */
  --font-display: "Bungee", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--paper);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr auto auto;
  gap: 12px;
  max-width: 760px;
  margin: 0 auto;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- 招牌 ---------- */
.sign {
  text-align: center;
  font-weight: 900;
  font-size: clamp(28px, 7vw, 44px);
  letter-spacing: 0.08em;
  color: var(--paper);
  text-shadow: 0 0 6px var(--neon), 0 0 18px var(--neon), 0 0 36px rgba(255, 68, 56, 0.6);
  text-wrap: balance;
  line-height: 1.2;
}
.sign small {
  display: block;
  font-size: 0.36em;
  letter-spacing: 0.3em;
  color: var(--lantern);
  text-shadow: 0 0 8px rgba(255, 197, 77, 0.7);
  font-weight: 700;
}

/* ---------- 計分板 ---------- */
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr) auto;
  gap: 8px;
  align-items: stretch;
}
.stat {
  background: var(--coal);
  border: 1px solid rgba(255, 122, 46, 0.25);
  border-radius: 10px;
  padding: 6px 10px;
  display: grid;
  gap: 2px;
  min-width: 0;
}
.stat b {
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--muted);
  font-weight: 700;
}
.stat span {
  font-family: var(--font-display);
  font-size: clamp(20px, 5vw, 28px);
  color: var(--lantern);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.stat.time.low span { color: var(--neon); animation: blink 0.5s steps(2) infinite; }
.sound {
  background: var(--coal);
  color: var(--paper);
  border: 1px solid rgba(255, 122, 46, 0.25);
  border-radius: 10px;
  padding: 0 12px;
  font: 700 13px var(--font-body);
  cursor: pointer;
}

/* ---------- 烤架 ---------- */
.grill {
  position: relative;
  border-radius: 18px;
  padding: 14px;
  background:
    repeating-linear-gradient(90deg, transparent 0 22px, rgba(0, 0, 0, 0.55) 22px 28px),
    radial-gradient(120% 90% at 50% 100%, #ff6a1f 0%, #a8340f 35%, #3b160b 70%, #1f0e08 100%);
  box-shadow: inset 0 0 0 4px #4a3226, inset 0 0 40px rgba(0, 0, 0, 0.7), 0 10px 30px rgba(0, 0, 0, 0.5);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 1fr;
  gap: 12px;
  min-height: 0;
  overflow: hidden;
}
.grill::after { /* 炭火閃爍 */
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(60% 40% at 50% 100%, rgba(255, 140, 40, 0.35), transparent 70%);
  animation: flicker 2.2s ease-in-out infinite;
  pointer-events: none;
}
.slot {
  position: relative;
  z-index: 1;
  border: 2px dashed rgba(255, 220, 190, 0.18);
  border-radius: 14px;
  background: rgba(20, 8, 4, 0.28);
  display: grid;
  place-items: center;
  align-content: center;
  gap: 10px;
  cursor: pointer;
  color: var(--paper);
  font: 700 15px var(--font-body);
  padding: 8px;
  min-height: 0;
  min-width: 0;
  touch-action: manipulation;
}
.slot:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
.slot.filled { border-style: solid; border-color: transparent; background: transparent; }
.empty-hint { color: rgba(251, 238, 221, 0.55); font-size: 14px; }
.empty-hint::before { content: "＋ "; color: var(--lantern); }

/* 香腸本體 */
.sausage {
  width: 88%;
  max-width: 170px;
  aspect-ratio: 4 / 1.25;
  border-radius: 999px;
  position: relative;
  background: var(--c, #f3a7a0);
  box-shadow:
    inset 0 6px 8px rgba(255, 255, 255, 0.28),
    inset 0 -8px 10px rgba(0, 0, 0, 0.35),
    0 6px 10px rgba(0, 0, 0, 0.45);
  transition: background-color 0.2s linear;
}
.sausage::before, .sausage::after { /* 兩端的綁繩 */
  content: "";
  position: absolute;
  top: 50%;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.35);
  transform: translateY(-50%);
}
.sausage::before { left: -3px; }
.sausage::after { right: -3px; }
.marks { /* 烤網痕：上面那面烤過才會出現 */
  position: absolute;
  inset: 18% 14%;
  border-radius: 999px;
  background: repeating-linear-gradient(115deg, transparent 0 14px, rgba(40, 14, 6, 0.75) 14px 19px);
  opacity: var(--m, 0);
}
.sausage.flip { animation: flip 0.28s ease-out; }
.sausage.burnt { background: #1b0f0a; }

/* 魷魚：左邊鰭、右邊觸手，身上有切花 */
.sausage.squid {
  width: 64%;
  max-width: 130px;
  aspect-ratio: 4 / 1.6;
  border-radius: 48% 22% 22% 48% / 50%;
  margin-right: 14%;
}
.sausage.squid::before { /* 鰭 */
  left: -16%;
  width: 26%;
  height: 130%;
  border-radius: 0;
  background: var(--c);
  clip-path: polygon(0 50%, 100% 0, 100% 100%);
  filter: brightness(0.92);
}
.sausage.squid::after { /* 觸手 */
  right: -30%;
  width: 34%;
  height: 86%;
  border-radius: 0 40% 40% 0;
  background: repeating-linear-gradient(180deg, var(--c) 0 5px, transparent 5px 9px);
}
.sausage.squid .marks {
  inset: 16% 10%;
  background:
    repeating-linear-gradient(45deg, transparent 0 9px, rgba(60, 22, 8, 0.7) 9px 12px),
    repeating-linear-gradient(-45deg, transparent 0 9px, rgba(60, 22, 8, 0.7) 9px 12px);
}
.sausage.squid.burnt { --c: #1b0f0a; }

/* 選要放什麼 */
.picker {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.pick {
  appearance: none;
  background: var(--coal);
  color: var(--paper);
  border: 2px solid rgba(255, 122, 46, 0.25);
  border-radius: 12px;
  padding: 8px;
  font: 900 16px var(--font-body);
  cursor: pointer;
  touch-action: manipulation;
}
.pick small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
.pick[aria-pressed="true"] { border-color: var(--lantern); box-shadow: 0 0 14px rgba(255, 197, 77, 0.45); color: var(--lantern); }
.pick:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }

/* 底面熟度條 */
.under {
  width: 88%;
  max-width: 170px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px;
  align-items: center;
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
}
.bar {
  position: relative;
  height: 8px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.5);
  overflow: hidden;
}
.bar::before { /* 60–88 剛好區間 */
  content: "";
  position: absolute;
  left: 60%;
  width: 28%;
  top: 0;
  bottom: 0;
  background: rgba(143, 209, 106, 0.35);
}
.bar i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--w, 0%);
  background: var(--bc, var(--ember));
  border-radius: 999px;
}

/* 可以出餐 */
.slot.ready .sausage { outline: 3px solid var(--ok); outline-offset: 4px; animation: pulse 0.8s ease-in-out infinite; }
.tag {
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ok);
  color: #14210c;
  font-size: 12px;
  font-weight: 900;
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
}

/* 冒煙 */
.smoke {
  position: absolute;
  left: 50%;
  top: 30%;
  width: 0;
  height: 0;
  pointer-events: none;
}
.smoke span {
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: rgba(200, 190, 180, 0.5);
  filter: blur(3px);
  animation: smoke 1.1s ease-out infinite;
}
.smoke span:nth-child(2) { animation-delay: 0.35s; left: -14px; }
.smoke span:nth-child(3) { animation-delay: 0.7s; left: 12px; }

/* 飄字 */
.float {
  position: absolute;
  left: 50%;
  top: 35%;
  transform: translateX(-50%);
  font-family: var(--font-body);
  font-weight: 900;
  font-size: 18px;
  white-space: nowrap;
  pointer-events: none;
  animation: floatUp 0.9s ease-out forwards;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
}
.float.good { color: var(--ok); }
.float.meh { color: var(--lantern); }
.float.bad { color: var(--neon); }

.hint {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}
.hint b { color: var(--paper); }

/* ---------- 開始／結束畫面 ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  background: rgba(15, 8, 5, 0.86);
  backdrop-filter: blur(3px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.card {
  width: min(420px, 100%);
  background: var(--coal);
  border: 1px solid rgba(255, 122, 46, 0.35);
  border-radius: 18px;
  padding: 24px 22px;
  display: grid;
  gap: 14px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
}
.card h2 {
  margin: 0;
  font-size: 26px;
  font-weight: 900;
  color: var(--lantern);
  text-wrap: balance;
}
.rules {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 8px;
  text-align: left;
  font-size: 15px;
  line-height: 1.5;
}
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.rules li::before {
  content: attr(data-n);
  font-family: var(--font-display);
  color: var(--ember);
}
.big {
  font-family: var(--font-display);
  font-size: 56px;
  color: var(--lantern);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.rank { font-size: 20px; font-weight: 900; color: var(--paper); }
.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.summary div {
  background: rgba(0, 0, 0, 0.25);
  border-radius: 10px;
  padding: 8px 4px;
  display: grid;
  gap: 2px;
  font-size: 12px;
  color: var(--muted);
}
.summary strong {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--paper);
  font-weight: 400;
}
.best { font-size: 13px; color: var(--muted); }
.go {
  appearance: none;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  background: var(--neon);
  color: #fff;
  font: 900 18px var(--font-body);
  letter-spacing: 0.1em;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(255, 68, 56, 0.55);
}
.go:focus-visible { outline: 3px solid var(--lantern); outline-offset: 3px; }

/* ---------- 刺激感：橫幅、FEVER、火花、震動 ---------- */
.stat { position: relative; }
.stat span { transform-origin: left center; }
.stat span.bump { animation: bump 0.25s ease-out; }
.banner {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  pointer-events: none;
  font-weight: 900;
  font-size: clamp(34px, 9vw, 64px);
  color: var(--lantern);
  text-shadow: 0 0 12px var(--neon), 0 0 28px var(--neon), 0 4px 0 #000;
  letter-spacing: 0.04em;
  opacity: 0;
  text-align: center;
}
.banner.show { animation: bannerPop 0.75s ease-out; }
.grill.fever {
  box-shadow: inset 0 0 0 4px var(--lantern), inset 0 0 40px rgba(0, 0, 0, 0.5), 0 0 34px rgba(255, 160, 40, 0.75);
}
.grill.fever::after {
  background: radial-gradient(90% 70% at 50% 100%, rgba(255, 190, 60, 0.6), transparent 70%);
  animation-duration: 0.35s;
}
.sausage.golden {
  box-shadow:
    inset 0 6px 8px rgba(255, 255, 255, 0.35),
    inset 0 -8px 10px rgba(0, 0, 0, 0.3),
    0 0 0 3px var(--lantern),
    0 0 20px rgba(255, 197, 77, 0.9);
}
.spark {
  position: absolute;
  left: 50%;
  top: 40%;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--lantern);
  box-shadow: 0 0 8px var(--ember);
  pointer-events: none;
  animation: spark 0.6s ease-out forwards;
}
.app.shake { animation: shake 0.35s; }
@keyframes bump { 50% { transform: scale(1.35); } }
@keyframes bannerPop {
  0% { opacity: 0; transform: scale(0.4); }
  25% { opacity: 1; transform: scale(1.15); }
  65% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.05); }
}
@keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-8px, 2px); }
  40% { transform: translate(7px, -3px); }
  60% { transform: translate(-5px, 1px); }
  80% { transform: translate(4px, 0); }
}
@keyframes flicker { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
@keyframes flip { 0% { transform: scaleY(1); } 50% { transform: scaleY(0.15); } 100% { transform: scaleY(1); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes smoke { 0% { transform: translate(0, 0) scale(0.6); opacity: 0.8; } 100% { transform: translate(0, -50px) scale(1.8); opacity: 0; } }
@keyframes floatUp { 0% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -46px); opacity: 0; } }
@keyframes blink { 50% { opacity: 0.4; } }

@media (max-width: 480px) {
  .grill { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
  .board { grid-template-columns: repeat(3, 1fr); }
  .sound { grid-column: 1 / -1; padding: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .grill::after, .smoke span, .slot.ready .sausage, .stat.time.low span { animation: none; }
  .sausage.flip, .app.shake, .spark, .stat span.bump { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="sign" id="sign">烤香腸<small>NIGHT MARKET GRILL</small></header>

  <section class="board" aria-label="計分板">
    <div class="stat"><b>分數</b><span id="score">0</span></div>
    <div class="stat time" id="timeBox"><b>剩餘秒數</b><span id="time">60</span></div>
    <div class="stat"><b>連續完美</b><span id="combo">0</span></div>
    <button class="sound" id="soundBtn" type="button" aria-pressed="true">聲音：開</button>
  </section>

  <main class="grill" id="grill" aria-label="烤架"><div class="banner" id="banner" aria-live="polite"></div></main>

  <section class="picker" aria-label="選要烤什麼">
    <button class="pick" id="pickSausage" type="button" aria-pressed="true">香腸<small>經典款</small></button>
    <button class="pick" id="pickSquid" type="button" aria-pressed="false">魷魚<small>熟得慢・分數 ×1.5</small></button>
  </section>

  <p class="hint">選好下面的料，點空位<b>放上去</b>・點香腸<b>翻面</b>・兩面都烤到綠色區間會發光，<b>點一下出餐</b></p>
</div>

<div class="overlay" id="startScreen">
  <div class="card">
    <h2 id="startTitle">今晚你來顧攤</h2>
    <ul class="rules">
      <li data-n="1"><span>先選<b>香腸</b>或<b>魷魚</b>，再點空位放上去。魷魚熟得慢，但<b>分數 ×1.5</b>；發金光的是<b>黃金香腸，分數 ×3</b></span></li>
      <li data-n="2"><span>只有<b>貼著炭火的那面</b>會熟，香腸下面那條是底面熟度，點香腸就翻面</span></li>
      <li data-n="3"><span>兩面都進綠色區間會發光，點一下出餐：<b>完美 +1.5 秒</b>，連續 3 次進入 <b>FEVER 分數 ×2</b></span></li>
      <li data-n="4"><span>烤焦<b>扣分又扣 1 秒</b>；最後 5 秒火力全開</span></li>
    </ul>
    <button class="go" id="startBtn" type="button">開始烤（15 秒）</button>
  </div>
</div>

<div class="overlay" id="endScreen" hidden>
  <div class="card">
    <h2>收攤！</h2>
    <div class="big" id="finalScore">0</div>
    <div class="rank" id="rank">香腸學徒</div>
    <div class="summary">
      <div><strong id="sServed">0</strong>賣出</div>
      <div><strong id="sPerfect">0</strong>完美</div>
      <div><strong id="sBurnt">0</strong>烤焦</div>
    </div>
    <div class="best" id="best"></div>
    <button class="go" id="againBtn" type="button">再顧一次攤</button>
  </div>
</div>

<script>
/* ================= 遊戲設定：上課現場可以請 Claude 改這裡 ================= */
const CFG = {
  shopName: "黑豬烤香腸",   // 招牌上的攤位名稱
  roundSec: 25,             // 一局幾秒
  slots: 6,                 // 烤架上幾個位置
  rateMin: 10,              // 熟得最慢的速度（每秒）
  rateMax: 14,              // 熟得最快的速度（每秒）
  ready: 60,                // 到這個熟度就算熟了
  perfectMax: 88,           // 超過這個就「有點焦」
  burn: 100,                // 到這裡就烤焦
  sweetMin: 68,             // 兩面都落在這個區間＝神準，額外加分
  sweetMax: 78,
  pointsPerfect: 100,
  pointsSweet: 50,
  pointsOk: 30,
  pointsBurnt: -30,
  timePerfect: 1.5,         // 完美出餐加幾秒
  timeBurnt: 1,             // 烤焦扣幾秒
  feverAt: 3,               // 連續完美幾次進入 FEVER（分數 ×2、火變大）
  feverHeat: 1.3,
  rushSec: 5,               // 最後幾秒火力全開
  rushHeat: 1.25,
  goldenChance: 0.15,       // 黃金香腸出現機率
  goldenMult: 3,            // 黃金香腸分數倍率
  squidRate: 0.85,          // 魷魚熟的速度（香腸的幾倍，比較慢）
  squidMult: 1.5,           // 魷魚分數倍率
};
/* ======================================================================== */

const $ = (id) => document.getElementById(id);
const grill = $("grill");
document.title = CFG.shopName + "｜烤香腸大師";
$("sign").firstChild.textContent = CFG.shopName;
$("startBtn").textContent = `開始烤（${CFG.roundSec} 秒）`;

let slots, score, combo, served, perfect, burnt, timeLeft, running = false, last = 0;

/* 熟度 → 顏色：生（粉）→ 剛好（金黃）→ 焦（深褐）→ 黑 */
const STOPS = [
  [0, [243, 167, 160]],
  [40, [232, 140, 110]],
  [60, [205, 120, 60]],
  [85, [150, 74, 34]],
  [100, [45, 24, 16]],
];
/* 魷魚：生（半透明白）→ 金黃醬色 → 焦 */
const SQUID_STOPS = [
  [0, [238, 230, 218]],
  [40, [236, 200, 158]],
  [60, [218, 142, 78]],
  [85, [160, 82, 40]],
  [100, [45, 24, 16]],
];
function cookColor(v, kind) {
  const stops = kind === "squid" ? SQUID_STOPS : STOPS;
  v = Math.max(0, Math.min(100, v));
  for (let i = 1; i < stops.length; i++) {
    const [b, cb] = stops[i];
    const [a, ca] = stops[i - 1];
    if (v <= b) {
      const t = (v - a) / (b - a);
      const c = ca.map((x, k) => Math.round(x + (cb[k] - x) * t));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return "rgb(45,24,16)";
}

/* ---------- 聲音（WebAudio，自己合成，不用載音檔） ---------- */
let audio = null, sizzleGain = null, soundOn = true;
function initAudio() {
  if (audio) return;
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    const len = audio.sampleRate * 2;
    const buf = audio.createBuffer(1, len, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (0.6 + 0.4 * Math.random());
    const src = audio.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const bp = audio.createBiquadFilter();
    bp.type = "highpass";
    bp.frequency.value = 2500;
    sizzleGain = audio.createGain();
    sizzleGain.gain.value = 0;
    src.connect(bp).connect(sizzleGain).connect(audio.destination);
    src.start();
  } catch (e) { audio = null; }
}
function beep(freq, dur, type = "sine", vol = 0.15, slideTo) {
  if (!audio || !soundOn) return;
  const t = audio.currentTime;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t);
  o.stop(t + dur);
}
function setSizzle() {
  if (!sizzleGain) return;
  const n = running ? slots.filter((s) => s && !s.burnt).length : 0;
  sizzleGain.gain.setTargetAtTime(soundOn ? n * 0.012 : 0, audio.currentTime, 0.1);
}
$("soundBtn").addEventListener("click", () => {
  soundOn = !soundOn;
  $("soundBtn").textContent = "聲音：" + (soundOn ? "開" : "關");
  $("soundBtn").setAttribute("aria-pressed", String(soundOn));
  if (soundOn) initAudio();
  setSizzle();
});

/* ---------- 建立烤架 ---------- */
const slotEls = [];
for (let i = 0; i < CFG.slots; i++) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "slot";
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); tap(i); });
  b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(i); } });
  grill.appendChild(b);
  slotEls.push(b);
}

let pickKind = "sausage";
function setPick(kind) {
  pickKind = kind;
  $("pickSausage").setAttribute("aria-pressed", String(kind === "sausage"));
  $("pickSquid").setAttribute("aria-pressed", String(kind === "squid"));
}
$("pickSausage").addEventListener("click", () => setPick("sausage"));
$("pickSquid").addEventListener("click", () => setPick("squid"));

function newSausage() {
  const kind = pickKind;
  const golden = kind === "sausage" && Math.random() < CFG.goldenChance;
  return {
    kind,
    top: 0,
    bottom: 0,
    rate: (CFG.rateMin + Math.random() * (CFG.rateMax - CFG.rateMin)) * (golden ? 1.2 : 1) * (kind === "squid" ? CFG.squidRate : 1),
    golden,
    burnt: false,
    burntT: 0,
  };
}

function heat() {
  let h = 1;
  if (combo >= CFG.feverAt) h *= CFG.feverHeat;
  if (timeLeft <= CFG.rushSec) h *= CFG.rushHeat;
  return h;
}

function banner(text) {
  const el = $("banner");
  el.textContent = text;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
}

function sparks(i, n) {
  for (let k = 0; k < n; k++) {
    const s = document.createElement("div");
    s.className = "spark";
    const ang = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 60;
    s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    s.style.setProperty("--dy", Math.sin(ang) * dist - 20 + "px");
    slotEls[i].appendChild(s);
    setTimeout(() => s.remove(), 650);
  }
}

function timeFloat(text, cls) {
  const f = document.createElement("div");
  f.className = "float " + cls;
  f.textContent = text;
  $("timeBox").appendChild(f);
  setTimeout(() => f.remove(), 900);
}

function bump(id) {
  const el = $(id);
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}

function shake() {
  const app = document.querySelector(".app");
  app.classList.remove("shake");
  void app.offsetWidth;
  app.classList.add("shake");
}

function renderSlot(i) {
  const s = slots[i];
  const el = slotEls[i];
  if (!s) {
    el.className = "slot";
    el.innerHTML = '<span class="empty-hint">放一根</span>';
    el.setAttribute("aria-label", "空的烤位，點一下放香腸");
    el._built = false;
    return;
  }
  const kind = s.kind || "sausage";
  const name = kind === "squid" ? "魷魚" : "香腸";
  if (!el._built || el._kind !== kind) {
    el._kind = kind;
    el.innerHTML =
      `<div class="sausage${kind === "squid" ? " squid" : ""}"><div class="marks"></div></div>` +
      '<div class="under"><span>底面</span><div class="bar"><i></i></div></div>' +
      '<div class="smoke" hidden><span></span><span></span><span></span></div>' +
      '<div class="tag" hidden>點我出餐</div>';
    el._built = true;
    el._saus = el.querySelector(".sausage");
    el._bar = el.querySelector(".bar i");
    el._smoke = el.querySelector(".smoke");
    el._tag = el.querySelector(".tag");
  }
  const ready = !s.burnt && s.top >= CFG.ready && s.bottom >= CFG.ready;
  el.className = "slot filled" + (ready ? " ready" : "");
  el._saus.classList.toggle("burnt", s.burnt);
  el._saus.classList.toggle("golden", !!s.golden && !s.burnt);
  el._saus.style.setProperty("--c", cookColor(s.top, kind));
  el._saus.style.setProperty("--m", Math.max(0, Math.min(1, (s.top - 35) / 30)).toFixed(2));
  el._bar.style.setProperty("--w", Math.min(100, s.bottom) + "%");
  el._bar.style.setProperty("--bc", cookColor(s.bottom, kind));
  el._smoke.hidden = !(s.burnt || s.bottom > CFG.perfectMax);
  el._tag.hidden = !ready;
  el.setAttribute("aria-label", s.burnt ? "烤焦了" : ready ? "烤好了，點一下出餐" : `${name}：上面 ${Math.round(s.top)}、底面 ${Math.round(s.bottom)}，點一下翻面`);
}

function floatText(i, text, cls) {
  const f = document.createElement("div");
  f.className = "float " + cls;
  f.textContent = text;
  slotEls[i].appendChild(f);
  setTimeout(() => f.remove(), 900);
}

function tap(i) {
  if (!running) return;
  const s = slots[i];
  if (!s) {
    slots[i] = newSausage();
    beep(300, 0.08, "triangle", 0.12);
  } else if (s.burnt) {
    return;
  } else if (s.top >= CFG.ready && s.bottom >= CFG.ready) {
    const isPerfect = s.top <= CFG.perfectMax && s.bottom <= CFG.perfectMax;
    const golden = s.golden;
    const squidMult = s.kind === "squid" ? CFG.squidMult : 1;
    let pts, msg, cls;
    if (isPerfect) {
      combo++;
      perfect++;
      const sweet = [s.top, s.bottom].every((v) => v >= CFG.sweetMin && v <= CFG.sweetMax);
      let mult = Math.min(1 + 0.5 * (combo - 1), 5);
      if (combo >= CFG.feverAt) mult *= 2;
      pts = CFG.pointsPerfect * mult + (sweet ? CFG.pointsSweet : 0);
      if (golden) pts *= CFG.goldenMult;
      pts = Math.round(pts * squidMult);
      timeLeft += CFG.timePerfect;
      msg = `${sweet ? "神準" : "完美"}！+${pts}`; cls = "good";
      beep(660 * Math.pow(1.06, Math.min(combo, 12)), 0.16, "sine", 0.18, 1320 * Math.pow(1.06, Math.min(combo, 12)));
      if (golden) setTimeout(() => beep(1760, 0.2, "triangle", 0.12), 90);
      timeFloat(`+${CFG.timePerfect} 秒`, "good");
      if (combo === CFG.feverAt) banner("FEVER ×2");
      else if (golden) banner("黃金香腸 ×" + CFG.goldenMult);
      else if (combo >= 2) banner(combo + " 連發！");
      else if (s.kind === "squid") banner("香噴噴魷魚！");
    } else {
      combo = 0;
      pts = Math.round(CFG.pointsOk * (golden ? CFG.goldenMult : 1) * squidMult);
      msg = `有點焦 +${pts}`; cls = "meh";
      beep(520, 0.15, "sine", 0.14);
    }
    score += pts;
    served++;
    slots[i] = null;
    renderSlot(i);
    floatText(i, msg, cls);
    sparks(i, isPerfect ? (golden ? 18 : 10) : 0);
    bump("score");
    updateBoard();
    return;
  } else {
    [s.top, s.bottom] = [s.bottom, s.top];
    const saus = slotEls[i]._saus;
    if (saus) { saus.classList.remove("flip"); void saus.offsetWidth; saus.classList.add("flip"); }
    beep(180, 0.06, "square", 0.05);
  }
  renderSlot(i);
  updateBoard();
}

function updateBoard() {
  const fever = running && combo >= CFG.feverAt;
  $("score").textContent = score;
  $("combo").textContent = fever ? combo + " ×2" : combo;
  $("time").textContent = timeLeft <= 10 ? Math.max(0, timeLeft).toFixed(1) : Math.ceil(timeLeft);
  $("timeBox").classList.toggle("low", running && timeLeft <= CFG.rushSec);
  grill.classList.toggle("fever", fever);
}

let rushOn = false, lastSec = 0;
function loop(now) {
  if (!running) return;
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  timeLeft -= dt;
  if (!rushOn && timeLeft <= CFG.rushSec) {
    rushOn = true;
    banner("最後衝刺！");
  }
  const sec = Math.ceil(timeLeft);
  if (rushOn && sec !== lastSec && sec > 0) beep(1000, 0.05, "square", 0.06);
  lastSec = sec;
  const h = heat();
  for (let i = 0; i < slots.length; i++) {
    const s = slots[i];
    if (!s) continue;
    if (!s.burnt) {
      s.bottom += s.rate * h * dt;
      if (s.bottom >= CFG.burn) {
        s.burnt = true;
        score = Math.max(0, score + CFG.pointsBurnt);
        timeLeft -= CFG.timeBurnt;
        if (combo >= CFG.feverAt) banner("FEVER 斷了");
        combo = 0;
        burnt++;
        floatText(i, `烤焦 ${CFG.pointsBurnt}`, "bad");
        timeFloat(`-${CFG.timeBurnt} 秒`, "bad");
        shake();
        beep(110, 0.3, "sawtooth", 0.14, 60);
      }
    } else {
      s.burntT += dt;
      if (s.burntT > 0.9) { slots[i] = null; }
    }
    renderSlot(i);
  }
  setSizzle();
  if (timeLeft <= 0) { timeLeft = 0; endGame(); }
  updateBoard();
  if (running) requestAnimationFrame(loop);
}

function start() {
  initAudio();
  if (audio && audio.state === "suspended") audio.resume();
  slots = Array(CFG.slots).fill(null);
  score = 0; combo = 0; served = 0; perfect = 0; burnt = 0;
  timeLeft = CFG.roundSec;
  rushOn = false;
  slotEls.forEach((el) => (el._built = false));
  for (let i = 0; i < CFG.slots; i++) renderSlot(i);
  $("startScreen").hidden = true;
  $("endScreen").hidden = true;
  running = true;
  updateBoard();
  last = performance.now();
  requestAnimationFrame(loop);
}

function rankOf(sc) {
  if (sc < 300) return "香腸學徒";
  if (sc < 800) return "夜市新手攤";
  if (sc < 1600) return "排隊人氣攤";
  if (sc < 2800) return "夜市傳奇";
  return "香腸之神";
}

function endGame() {
  running = false;
  setSizzle();
  beep(660, 0.12, "sine", 0.15);
  setTimeout(() => beep(990, 0.25, "sine", 0.15), 130);
  $("finalScore").textContent = score;
  $("rank").textContent = rankOf(score);
  $("sServed").textContent = served;
  $("sPerfect").textContent = perfect;
  $("sBurnt").textContent = burnt;
  let best = 0;
  try { best = Number(localStorage.getItem("sausage-best") || 0); } catch (e) {}
  if (score > best) {
    best = score;
    try { localStorage.setItem("sausage-best", String(best)); } catch (e) {}
    $("best").textContent = "新紀錄！";
  } else {
    $("best").textContent = `這台裝置的最高分：${best}`;
  }
  $("endScreen").hidden = false;
}

$("startBtn").addEventListener("click", start);
$("againBtn").addEventListener("click", start);

/* 開場畫面先擺幾根示範香腸，讓第一眼就看得出是烤架 */
slots = [
  { top: 70, bottom: 30, rate: 0, burnt: false, burntT: 0 },
  { top: 0, bottom: 0, rate: 0, burnt: false, burntT: 0 },
  null,
  { top: 75, bottom: 72, rate: 0, burnt: false, burntT: 0 },
  { kind: "squid", top: 65, bottom: 20, rate: 0, burnt: false, burntT: 0 },
  { top: 40, bottom: 90, rate: 0, burnt: false, burntT: 0 },
];
for (let i = 0; i < CFG.slots; i++) renderSlot(i);
score = 0; combo = 0; timeLeft = CFG.roundSec;
updateBoard();
</script>
